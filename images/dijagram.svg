<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1e293b">
    eOsiguranje - Spring Boot Pojednostavljena Arhitektura
  </text>
  
  <!-- Frontend -->
  <rect x="450" y="70" width="300" height="60" fill="#a78bfa" stroke="#7c3aed" stroke-width="2" rx="5"/>
  <text x="600" y="105" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">React Frontend (localhost:5173)</text>
  
  <!-- Arrow -->
  <path d="M 600 130 L 600 170" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Security Layer -->
  <rect x="50" y="170" width="1100" height="120" fill="#fecaca" stroke="#dc2626" stroke-width="2" rx="5"/>
  <text x="600" y="195" font-size="18" font-weight="bold" text-anchor="middle" fill="#991b1b">Security Layer (Spring Security)</text>
  
  <rect x="100" y="210" width="450" height="60" fill="#fff" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="325" y="235" font-size="14" font-weight="bold" text-anchor="middle">JwtAuthenticationFilter</text>
  <text x="325" y="255" font-size="12" text-anchor="middle" fill="#64748b">Validacija JWT, ekstrakcija korisnika</text>
  
  <rect x="650" y="210" width="450" height="60" fill="#fff" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="875" y="235" font-size="14" font-weight="bold" text-anchor="middle">AccessControlFilter</text>
  <text x="875" y="255" font-size="12" text-anchor="middle" fill="#64748b">Provjera cijena, revokacija tokena</text>
  
  <!-- Arrow -->
  <path d="M 600 290 L 600 330" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Controllers -->
  <rect x="50" y="330" width="1100" height="120" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="5"/>
  <text x="600" y="355" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e40af">REST API Layer (Controllers)</text>
  
  <rect x="100" y="370" width="220" height="60" fill="#fff" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="210" y="395" font-size="13" font-weight="bold" text-anchor="middle">AuthController</text>
  <text x="210" y="415" font-size="11" text-anchor="middle" fill="#64748b">register, login, verify-2fa</text>
  
  <rect x="350" y="370" width="220" height="60" fill="#fff" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="460" y="395" font-size="13" font-weight="bold" text-anchor="middle">PolicyController</text>
  <text x="460" y="415" font-size="11" text-anchor="middle" fill="#64748b">pregled polisa</text>
  
  <rect x="600" y="370" width="220" height="60" fill="#fff" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="710" y="395" font-size="13" font-weight="bold" text-anchor="middle">PurchaseController</text>
  <text x="710" y="415" font-size="11" text-anchor="middle" fill="#64748b">kupovina, webhook</text>
  
  <rect x="850" y="370" width="220" height="60" fill="#fff" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="960" y="395" font-size="13" font-weight="bold" text-anchor="middle">AdminController</text>
  <text x="960" y="415" font-size="11" text-anchor="middle" fill="#64748b">administracija</text>
  
  <!-- Arrow -->
  <path d="M 600 450 L 600 490" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Services -->
  <rect x="50" y="490" width="1100" height="120" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="600" y="515" font-size="18" font-weight="bold" text-anchor="middle" fill="#15803d">Service Layer</text>
  
  <rect x="100" y="530" width="220" height="60" fill="#fff" stroke="#16a34a" stroke-width="1" rx="3"/>
  <text x="210" y="555" font-size="13" font-weight="bold" text-anchor="middle">UserService</text>
  <text x="210" y="575" font-size="11" text-anchor="middle" fill="#64748b">CRUD, login, 2FA</text>
  
  <rect x="350" y="530" width="220" height="60" fill="#fff" stroke="#16a34a" stroke-width="1" rx="3"/>
  <text x="460" y="555" font-size="13" font-weight="bold" text-anchor="middle">PolicyService</text>
  <text x="460" y="575" font-size="11" text-anchor="middle" fill="#64748b">validacija, dohvat</text>
  
  <rect x="600" y="530" width="220" height="60" fill="#fff" stroke="#16a34a" stroke-width="1" rx="3"/>
  <text x="710" y="555" font-size="13" font-weight="bold" text-anchor="middle">MailService</text>
  <text x="710" y="575" font-size="11" text-anchor="middle" fill="#64748b">slanje 2FA koda</text>
  
  <rect x="850" y="530" width="220" height="60" fill="#fff" stroke="#16a34a" stroke-width="1" rx="3"/>
  <text x="960" y="555" font-size="13" font-weight="bold" text-anchor="middle">SecurityEventService</text>
  <text x="960" y="575" font-size="11" text-anchor="middle" fill="#64748b">logiranje događaja</text>
  
  <!-- Arrow -->
  <path d="M 600 610 L 600 650" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Repositories -->
  <rect x="50" y="650" width="1100" height="100" fill="#fef08a" stroke="#ca8a04" stroke-width="2" rx="5"/>
  <text x="600" y="675" font-size="18" font-weight="bold" text-anchor="middle" fill="#854d0e">Repository Layer (JPA)</text>
  
  <rect x="150" y="690" width="200" height="45" fill="#fff" stroke="#ca8a04" stroke-width="1" rx="3"/>
  <text x="250" y="717" font-size="13" font-weight="bold" text-anchor="middle">UserRepository</text>
  
  <rect x="400" y="690" width="200" height="45" fill="#fff" stroke="#ca8a04" stroke-width="1" rx="3"/>
  <text x="500" y="717" font-size="13" font-weight="bold" text-anchor="middle">PolicyRepository</text>
  
  <rect x="650" y="690" width="200" height="45" fill="#fff" stroke="#ca8a04" stroke-width="1" rx="3"/>
  <text x="750" y="717" font-size="13" font-weight="bold" text-anchor="middle">User2FARepository</text>
  
  <rect x="900" y="690" width="200" height="45" fill="#fff" stroke="#ca8a04" stroke-width="1" rx="3"/>
  <text x="1000" y="717" font-size="13" font-weight="bold" text-anchor="middle">SecurityEventRepository</text>
  
  <!-- Arrow -->
  <path d="M 600 750 L 600 790" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Database -->
  <rect x="50" y="790" width="1100" height="100" fill="#334155" stroke="#0f172a" stroke-width="2" rx="5"/>
  <text x="600" y="820" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">MySQL Database</text>
  
  <rect x="150" y="835" width="200" height="40" fill="#475569" stroke="#1e293b" stroke-width="1" rx="3"/>
  <text x="250" y="860" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">User</text>
  
  <rect x="400" y="835" width="200" height="40" fill="#475569" stroke="#1e293b" stroke-width="1" rx="3"/>
  <text x="500" y="860" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Policy</text>
  
  <rect x="650" y="835" width="200" height="40" fill="#475569" stroke="#1e293b" stroke-width="1" rx="3"/>
  <text x="750" y="860" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">User2FA</text>
  
  <rect x="900" y="835" width="200" height="40" fill="#475569" stroke="#1e293b" stroke-width="1" rx="3"/>
  <text x="1000" y="860" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">SecurityEvent</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
</svg>